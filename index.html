<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Musical</title>
<meta name="description" content="Descubra a porcentagem de match musical entre duas pessoas pelo Last.fm.">
<style>
  :root {
    --bg: #0f1012;
    --card: #181a1d;
    --line: #2a2d32;
    --text: #f2f3f5;
    --muted: #9aa0a8;
    --accent: #ff4d6d;
    --accent-ink: #2b0710;
    --track: #2a2d32;
    --danger: #ff8a8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; min-height: 100vh; }
  main { max-width: 520px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.9rem; line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.02em; }
  h2 { font-size: 1.1rem; margin: 28px 0 12px; }
  p { margin: 0 0 12px; color: var(--muted); }
  .brand { font-weight: 700; color: var(--accent); font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 20px; cursor: pointer; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-top: 16px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 14px 0 6px; }
  input[type=text] {
    width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 1rem;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--text); font-size: .9rem; cursor: pointer;
  }
  .chip[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px 18px; border: 0; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1rem; cursor: pointer;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .6; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 600; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row .btn { flex: 1; }
  .list { list-style: none; padding: 0; margin: 0; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .pos { width: 24px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; flex-shrink: 0; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 1.1rem;
  }
  .name { font-weight: 600; color: var(--text); text-decoration: none; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: .82rem; color: var(--muted); }
  .grow { min-width: 0; flex: 1; }
  .duo { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 8px; }
  .duo .avatar { width: 52px; height: 52px; border: 2px solid var(--bg); }
  .duo .amp { color: var(--muted); font-weight: 700; }
  .ring-wrap { display: grid; place-items: center; margin: 20px 0 8px; }
  .ring {
    --p: 0; width: 200px; height: 200px; border-radius: 50%;
    background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--track) 0);
    display: grid; place-items: center; position: relative;
  }
  .ring::before { content: ""; position: absolute; inset: 14px; border-radius: 50%; background: var(--bg); }
  .ring span { position: relative; font-size: 3rem; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .verdict { text-align: center; font-size: 1.15rem; font-weight: 700; color: var(--text); margin: 8px 0 4px; }
  .center { text-align: center; }
  .error { color: var(--danger); margin-top: 12px; }
  .spinner {
    width: 40px; height: 40px; border-radius: 50%; margin: 60px auto 16px;
    border: 4px solid var(--track); border-top-color: var(--accent); animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .foot { font-size: .78rem; color: var(--muted); margin-top: 28px; text-align: center; }
  code { background: var(--card); padding: 2px 6px; border-radius: 6px; }
  .poster-wrap { margin-top: 16px; display: grid; place-items: center; }
  .poster-wrap canvas { width: 100%; max-width: 420px; height: auto; border-radius: 18px; border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,.45); transition: opacity .2s; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .sw { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
  .sw[aria-pressed=true] { outline: 2px solid var(--text); outline-offset: 2px; }
  input[type=color] { width: 40px; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: transparent; padding: 2px; cursor: pointer; }
  .check { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: .95rem; margin: 14px 0 0; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
</style>
</head>
<body>
<main id="app"></main>
<script>
// ====== CONFIGURAÇÃO ======
// Cole aqui a sua API key do Last.fm (last.fm/api/account/create)
const API_KEY = '0b7a6904d2efddf9d8620f85e611178a';
const LIMIT = 50;
// ==========================

const PERIODS = [
  { id: '7day', label: '7 dias' },
  { id: '1month', label: '1 mês' },
  { id: '3month', label: '3 meses' },
  { id: '12month', label: '1 ano' },
  { id: 'overall', label: 'Sempre' }
];
const BASE_URL = location.origin + location.pathname;
const app = document.getElementById('app');

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const local = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const periodLabel = id => (PERIODS.find(p => p.id === id) || PERIODS[1]).label;

// ---------- Last.fm ----------
async function lfm(params) {
  const url = 'https://ws.audioscrobbler.com/2.0/?' + new URLSearchParams({ ...params, api_key: API_KEY, format: 'json' });
  let r, d;
  try { r = await fetch(url); d = await r.json(); }
  catch { const e = new Error('rede'); e.code = 'net'; throw e; }
  if (d && d.error) { const e = new Error(d.message); e.code = d.error; throw e; }
  return d;
}

async function loadUser(user, period) {
  const [info, top] = await Promise.all([
    lfm({ method: 'user.getinfo', user }),
    lfm({ method: 'user.gettopartists', user, period, limit: LIMIT })
  ]);
  const u = info.user || {};
  const imgs = Array.isArray(u.image) ? u.image : [];
  const img = (imgs.find(i => i.size === 'large') || imgs[imgs.length - 1] || {})['#text'] || '';
  const list = (top.topartists && top.topartists.artist) || [];
  return {
    user: u.name || user,
    name: u.realname || u.name || user,
    img,
    artists: (Array.isArray(list) ? list : [list]).map(a => ({ name: a.name, plays: +a.playcount || 0, url: a.url }))
  };
}

function errorMessage(e, who) {
  if (e.code === 6) return `Não encontrei o usuário "${who}" no Last.fm. Confere o nome?`;
  if (e.code === 10 || e.code === 26) return 'A API key do Last.fm está inválida. Confira a constante API_KEY no arquivo.';
  if (e.code === 29) return 'Muitas consultas seguidas. Espera um minutinho e tenta de novo.';
  if (e.code === 17) return `O perfil de "${who}" está privado no Last.fm.`;
  if (e.code === 'net') return 'Não consegui falar com o Last.fm. Confere a internet e tenta de novo.';
  return 'Algo deu errado ao buscar os dados. Tenta de novo.';
}

// ---------- Match ----------
function weights(artists) {
  const m = new Map(), N = artists.length;
  artists.forEach((a, i) => m.set(a.name.toLowerCase(), { w: (N - i) / N, rank: i + 1, plays: a.plays }));
  return m;
}

function computeMatch(A, B) {
  const a = weights(A.artists), b = weights(B.artists);
  let shared = 0, total = 0;
  a.forEach(v => total += v.w);
  b.forEach(v => total += v.w);
  const common = [];
  A.artists.forEach(art => {
    const k = art.name.toLowerCase();
    if (b.has(k)) {
      const wa = a.get(k), wb = b.get(k);
      shared += Math.min(wa.w, wb.w);
      common.push({ ...art, a: wa, b: wb, score: wa.w * wb.w });
    }
  });
  common.sort((x, y) => y.score - x.score);
  const raw = total ? (2 * shared) / total : 0;
  // curva de raiz: a sobreposição bruta costuma ser baixa, isso deixa o número mais intuitivo
  return { pct: Math.round(100 * Math.sqrt(raw)), common };
}

function verdict(p) {
  if (p >= 80) return 'Almas gêmeas musicais';
  if (p >= 60) return 'Dá pra dividir o fone';
  if (p >= 40) return 'Bastante coisa em comum';
  if (p >= 20) return 'Alguns pontos de encontro';
  if (p > 0) return 'Gostos bem diferentes';
  return 'Mundos opostos';
}

// ---------- Visual ----------
function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function avatar(name, img) {
  if (img) return `<img class="avatar" src="${esc(img)}" alt="">`;
  return `<div class="avatar" style="background:hsl(${hue(name)} 55% 38%)">${esc((name || '?')[0].toUpperCase())}</div>`;
}
function render(html) {
  app.innerHTML = `<div class="brand" id="home">Match Musical</div>` + html;
  document.getElementById('home').onclick = () => { history.replaceState(null, '', BASE_URL); renderForm(); };
}

// ---------- Telas ----------
function renderSetup() {
  render(`<h1>Falta configurar</h1><p>Abra este arquivo e cole sua API key do Last.fm na constante <code>API_KEY</code>.</p>`);
}

function renderForm(prefill = {}, error = '') {
  let period = prefill.p || local.get('period') || '7day';
  const open = !!prefill.b;
  render(`
    <h1>Seus álbuns mais ouvidos</h1>
    <p>Informe seu usuário do Last.fm e gere uma imagem moderna com as capas do que você mais ouviu, pronta pra exportar.</p>
    <form class="card" id="f" autocomplete="off">
      <label for="a">Seu usuário do Last.fm</label>
      <input type="text" id="a" value="${esc(prefill.a ?? local.get('me'))}" autocapitalize="none" spellcheck="false" required>
      <label>Período</label>
      ${chips(period)}
      <button class="btn" style="margin-top:20px">🎨 Gerar imagem dos meus álbuns</button>
      <button type="button" class="btn ghost" id="cmpToggle" style="margin-top:10px" aria-expanded="${open}">Comparar com outra pessoa</button>
      <div id="cmp" ${open ? '' : 'hidden'}>
        <label for="b">Usuário da outra pessoa</label>
        <input type="text" id="b" value="${esc(prefill.b || '')}" autocapitalize="none" spellcheck="false">
        <button type="button" class="btn" id="go" style="margin-top:14px">Calcular match</button>
        <button type="button" class="btn ghost" id="invite" style="margin-top:10px">Só gerar meu link de convite</button>
      </div>
      <p class="error" id="err">${esc(error)}</p>
    </form>
    <p class="foot">Não tem Last.fm? Crie em last.fm e conecte ao seu Spotify em Configurações → Aplicativos.</p>`);
  bindChips(p => period = p);
  const err = document.getElementById('err');
  const val = id => document.getElementById(id).value.trim();
  const save = a => { local.set('me', a); local.set('period', period); };
  document.getElementById('f').onsubmit = ev => {
    ev.preventDefault();
    const a = val('a');
    if (!a) return err.textContent = 'Preencha o seu usuário.';
    save(a); renderPoster(a, period);
  };
  const tg = document.getElementById('cmpToggle'), cmp = document.getElementById('cmp');
  tg.onclick = () => { cmp.hidden = !cmp.hidden; tg.setAttribute('aria-expanded', !cmp.hidden); if (!cmp.hidden) document.getElementById('b').focus(); };
  document.getElementById('go').onclick = () => {
    const a = val('a'), b = val('b');
    if (!a) return err.textContent = 'Preencha o seu usuário.';
    if (!b) return err.textContent = 'Preencha o usuário da outra pessoa, ou gere seu link de convite pra ela preencher.';
    save(a); run(a, b, period);
  };
  document.getElementById('invite').onclick = () => {
    const a = val('a');
    if (!a) return err.textContent = 'Preencha o seu usuário pra gerar o link.';
    save(a); renderMyLink(a, period);
  };
}

function chips(period) {
  return `<div class="chips">${PERIODS.map(p => `<button type="button" class="chip" data-p="${p.id}" aria-pressed="${p.id === period}">${p.label}</button>`).join('')}</div>`;
}
function bindChips(onChange) {
  app.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    onChange(c.dataset.p);
    app.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c));
  });
}
function shareButtons(link, text) {
  return `<div class="row">
      <button class="btn" data-copy>Copiar link</button>
      ${navigator.share ? '<button class="btn ghost" data-share>Compartilhar</button>' : ''}
    </div>`;
}
function bindShare(link, text) {
  const copy = app.querySelector('[data-copy]');
  if (copy) copy.onclick = async () => {
    try { await navigator.clipboard.writeText(link); copy.textContent = 'Copiado!'; }
    catch { prompt('Copie o link:', link); }
    setTimeout(() => copy.textContent = 'Copiar link', 2000);
  };
  const share = app.querySelector('[data-share]');
  if (share) share.onclick = () => navigator.share({ title: 'Match Musical', text, url: link }).catch(() => {});
}

// Tela de quem gera o convite
async function renderMyLink(a, p) {
  render(`<div class="spinner"></div><p class="center">Conferindo seu usuário…</p>`);
  let me;
  try { me = await loadUser(a, p); } catch (e) { return renderForm({ a, p }, errorMessage(e, a)); }
  const link = `${BASE_URL}?${new URLSearchParams({ a: me.user, p })}`;
  render(`
    <div class="duo">${avatar(me.name, me.img)}</div>
    <h1 class="center" style="margin-top:12px">Seu link de convite</h1>
    <p class="center">Mande pra quem você quiser. A pessoa só digita o usuário dela do Last.fm e já vê o match com você.</p>
    <div class="card">
      <input type="text" readonly value="${esc(link)}" aria-label="Seu link" style="font-size:.85rem;color:var(--muted)">
      ${shareButtons()}
    </div>
    <button class="btn ghost" id="back" style="margin-top:20px">Voltar</button>`);
  bindShare(link, `Qual é o nosso match musical? Coloca seu usuário do Last.fm aqui:`);
  document.getElementById('back').onclick = () => renderForm({ a: me.user, p });
}

// Tela de quem recebe o convite
function renderInvite(a, p, error = '') {
  let period = p;
  const mine = local.get('me');
  render(`
    <h1>${esc(a)} quer saber o match musical de vocês</h1>
    <p>Digite seu usuário do Last.fm pra comparar os artistas que vocês mais ouvem.</p>
    <form class="card" id="f" autocomplete="off">
      <label for="b">Seu usuário do Last.fm</label>
      <input type="text" id="b" value="${esc(mine && mine.toLowerCase() !== a.toLowerCase() ? mine : '')}" autocapitalize="none" spellcheck="false" required>
      <label>Período</label>
      ${chips(period)}
      <button class="btn" style="margin-top:20px">Ver nosso match</button>
      <p class="error">${esc(error)}</p>
    </form>
    <p class="foot">Não tem Last.fm? Crie em last.fm e conecte ao seu Spotify em Configurações → Aplicativos.</p>`);
  bindChips(x => period = x);
  document.getElementById('f').onsubmit = ev => {
    ev.preventDefault();
    const b = document.getElementById('b').value.trim();
    if (!b) return;
    local.set('me', b);
    run(a, b, period, true);
  };
}

async function run(a, b, p, fromInvite = false) {
  const back = msg => fromInvite ? renderInvite(a, p, msg) : renderForm({ a, b, p }, msg);
  render(`<div class="spinner"></div><p class="center">Comparando os ouvidos…</p>`);
  let A, B;
  try { A = await loadUser(a, p); } catch (e) { return back(errorMessage(e, a)); }
  try { B = await loadUser(b, p); } catch (e) { return back(errorMessage(e, b)); }
  if (A.user.toLowerCase() === B.user.toLowerCase()) return back(fromInvite ? 'Esse é o usuário de quem te convidou. Coloca o seu 😄' : 'Coloca o usuário de outra pessoa no segundo campo 😄');
  if (!A.artists.length || !B.artists.length) {
    const empty = !A.artists.length ? A.user : B.user;
    return back(`${empty} não tem scrobbles em "${periodLabel(p)}". Tenta um período maior.`);
  }
  history.replaceState(null, '', `${BASE_URL}?${new URLSearchParams({ a: A.user, b: B.user, p })}`);
  renderResult(A, B, p);
}

function renderResult(A, B, p) {
  const { pct, common } = computeMatch(A, B);
  const link = location.href;
  render(`
    <div class="duo">${avatar(A.name, A.img)}<span class="amp">&</span>${avatar(B.name, B.img)}</div>
    <h1 class="center" style="margin-top:12px">${esc(A.user)} e ${esc(B.user)}</h1>
    <p class="center">${periodLabel(p)}</p>
    <div class="ring-wrap"><div class="ring" id="ring"><span id="pct">0%</span></div></div>
    <div class="verdict">${verdict(pct)}</div>
    <p class="center">${common.length} ${common.length === 1 ? 'artista em comum' : 'artistas em comum'} no top ${LIMIT} de cada um</p>
    ${common.length
      ? `<h2>Artistas em comum</h2>
         <div class="card"><ul class="list">${common.map((c, i) => `
           <li class="item"><span class="pos">${i + 1}</span>${avatar(c.name)}
             <div class="grow">
               <a class="name" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.name)}</a>
               <div class="meta">${esc(A.user)}: #${c.a.rank} · ${c.a.plays} plays &nbsp;|&nbsp; ${esc(B.user)}: #${c.b.rank} · ${c.b.plays} plays</div>
             </div></li>`).join('')}
         </ul></div>`
      : `<div class="card"><p style="margin:0">Nenhum artista em comum nesse período.</p></div>`}
    <div style="margin-top:20px">${shareButtons()}</div>
    <div class="row">
      <button class="btn ghost" id="other">Trocar período</button>
      <button class="btn ghost" id="new">Novo match</button>
    </div>
    <p class="foot">Baseado nos ${LIMIT} artistas mais ouvidos de cada um no Last.fm.</p>`);

  bindShare(link, `Nosso match musical deu ${pct}%`);
  document.getElementById('other').onclick = () => renderForm({ a: A.user, b: B.user, p });
  document.getElementById('new').onclick = () => { history.replaceState(null, '', BASE_URL); renderForm(); };

  const ring = document.getElementById('ring'), label = document.getElementById('pct');
  const start = performance.now(), dur = 1200;
  (function tick(now) {
    const t = Math.min(1, (now - start) / dur), v = Math.round(pct * (1 - Math.pow(1 - t, 3)));
    ring.style.setProperty('--p', v); label.textContent = v + '%';
    if (t < 1) requestAnimationFrame(tick);
  })(start);
}

// ---------- Imagem dos artistas ----------
const FORMATS = { story: ['Story 9:16', 1920], feed: ['Feed 4:5', 1350], square: ['Quadrado', 1080] };
const THEMES = {
  noite: { label: 'Noite', base: '#09090e', ink: '#ffffff', dark: true },
  grafite: { label: 'Grafite', base: '#17181d', ink: '#ffffff', dark: true },
  cor: { label: 'Cor', base: null, ink: '#ffffff', dark: true },
  claro: { label: 'Claro', base: '#f4f0e9', ink: '#15141a', dark: false }
};
const SWATCHES = ['#ff4d6d', '#ff8a3d', '#ffd23f', '#3ddc97', '#35b6ff', '#8b5cf6', '#ff5ccf'];
const POSTER_DEFAULTS = { fmt: 'story', layout: 'grade', theme: 'noite', n: 9, accent: '#ff4d6d', plays: true, names: true, avatar: true, showTitle: true, title: 'Meus álbuns da semana' };

const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const rgba = (h, a) => { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; };
const lum = h => { const [r, g, b] = hexRgb(h); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
function hexHue(h) {
  const [r, g, b] = hexRgb(h).map(v => v / 255), mx = Math.max(r, g, b), d = mx - Math.min(r, g, b);
  if (!d) return 0;
  const x = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return (x * 60 + 360) % 360;
}
function hsl(h, s, l) { // -> #rrggbb
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)))));
  return '#' + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2, '0')).join('');
}
const FONT = (w, s) => `${w} ${Math.round(s)}px system-ui, "Segoe UI", Roboto, sans-serif`;
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function spaced(ctx, px) { if ('letterSpacing' in ctx) ctx.letterSpacing = px + 'px'; }
function fitSize(ctx, text, maxW, size, min, weight) {
  while (size > min) { ctx.font = FONT(weight, size); if (ctx.measureText(text).width <= maxW) break; size -= 2; }
  ctx.font = FONT(weight, size); return size;
}
function wrapWords(ctx, text, maxW) {
  const out = []; let line = '';
  for (const w of String(text).split(/\s+/).filter(Boolean)) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width <= maxW || !line) line = t; else { out.push(line); line = w; }
  }
  if (line) out.push(line); return out;
}
function wrapFit(ctx, text, maxW, maxLines, size, min, weight) {
  for (let s = size; s >= min; s -= 2) {
    ctx.font = FONT(weight, s);
    const lines = wrapWords(ctx, text, maxW);
    if (lines.length <= maxLines && lines.every(l => ctx.measureText(l).width <= maxW)) return { lines, size: s };
  }
  ctx.font = FONT(weight, min);
  const all = wrapWords(ctx, text, maxW), lines = all.slice(0, maxLines);
  if (all.length > maxLines) lines[maxLines - 1] += '…';
  return { lines: lines.map(l => { while (l.length > 1 && ctx.measureText(l).width > maxW) l = l.slice(0, -2) + '…'; return l; }), size: min };
}
function glow(ctx, x, y, r, hex, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(hex, a)); g.addColorStop(1, rgba(hex, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
}
function loadImg(url) {
  return new Promise(res => {
    if (!url) return res(null);
    const i = new Image(); i.crossOrigin = 'anonymous';
    const t = setTimeout(() => res(null), 4000); // não deixa a foto travar a tela
    i.onload = () => { clearTimeout(t); res(i); }; i.onerror = () => { clearTimeout(t); res(null); }; i.src = url;
  });
}

const clip = (ctx, t, maxW) => { t = String(t); while (t.length > 1 && ctx.measureText(t).width > maxW) t = t.slice(0, -2) + '…'; return t; };

async function loadAlbums(user, period) {
  const [info, top] = await Promise.all([
    lfm({ method: 'user.getinfo', user }),
    lfm({ method: 'user.gettopalbums', user, period, limit: 10 })
  ]);
  const u = info.user || {}, imgs = Array.isArray(u.image) ? u.image : [];
  const pick = list => (list.find(i => i.size === 'extralarge') || list.find(i => i.size === 'large') || list[list.length - 1] || {})['#text'] || '';
  const raw = (top.topalbums && top.topalbums.album) || [];
  const albums = (Array.isArray(raw) ? raw : [raw]).map(a => {
    const url = pick(Array.isArray(a.image) ? a.image : []);
    return { name: a.name, artist: (a.artist && a.artist.name) || '', plays: +a.playcount || 0, img: url.includes('2a96cbd8b46e442fc41c2b86b821562f') ? '' : url };
  });
  const [avEl] = await Promise.all([loadImg(pick(imgs)), ...albums.map(async al => { al.el = await loadImg(al.img); })]);
  return { user: u.name || user, avEl, albums };
}

function drawCover(ctx, al, x, y, sz, r, h) {
  ctx.save(); rr(ctx, x, y, sz, sz, r); ctx.clip();
  if (al.el) ctx.drawImage(al.el, x, y, sz, sz);
  else {
    const th = h + (hue(al.name) % 120);
    const g = ctx.createLinearGradient(x, y, x + sz, y + sz); g.addColorStop(0, hsl(th, 70, 48)); g.addColorStop(1, hsl(th + 40, 70, 28));
    ctx.fillStyle = g; ctx.fillRect(x, y, sz, sz);
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = FONT(900, sz * 0.42); ctx.textAlign = 'center'; ctx.fillText('♪', x + sz / 2, y + sz * 0.64); ctx.textAlign = 'left';
  }
  ctx.restore();
}

function drawPoster(cv, d, s) {
  const W = 1080, H = FORMATS[s.fmt][1], P = 84, story = s.fmt === 'story';
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d'), T = THEMES[s.theme] || THEMES.noite, acc = s.accent, h = hexHue(acc);
  const items = d.albums.slice(0, s.n);

  // fundo
  ctx.fillStyle = T.base || hsl(h, 45, 8); ctx.fillRect(0, 0, W, H);
  glow(ctx, W * 0.95, H * 0.02, W * 1.0, acc, T.dark ? 0.5 : 0.38);
  glow(ctx, -W * 0.1, H * 0.98, W * 0.95, hsl(h + 70, 85, 58), T.dark ? 0.35 : 0.28);
  glow(ctx, W * 0.5, H * 0.5, W * 0.7, acc, 0.07);

  // cabeçalho
  let y = story ? 150 : 84;
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const tag = `TOP ÁLBUNS · ${periodLabel(s.p).toUpperCase()}`;
  ctx.font = FONT(700, 26); spaced(ctx, 4);
  const tw = ctx.measureText(tag).width + 56;
  rr(ctx, P, y, tw, 56, 28); ctx.fillStyle = rgba(acc, 0.18); ctx.fill();
  ctx.strokeStyle = rgba(acc, 0.55); ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = T.dark ? acc : hsl(h, 70, 35); ctx.fillText(tag, P + 28, y + 37);
  spaced(ctx, 0); y += 56 + (story ? 48 : 34);

  if (s.showTitle && s.title.trim()) {
    const title = wrapFit(ctx, s.title, W - 2 * P, 2, story ? 108 : 80, 48, 900);
    spaced(ctx, -2); ctx.fillStyle = T.ink;
    title.lines.forEach((l, i) => ctx.fillText(l, P, y + title.size * 0.86 + i * title.size * 1.04));
    spaced(ctx, 0); y += title.lines.length * title.size * 1.04 + 24;
  } else y -= (story ? 48 : 34) - 28;

  const av = story ? 72 : 60;
  if (s.avatar) {
    ctx.save(); ctx.beginPath(); ctx.arc(P + av / 2, y + av / 2, av / 2, 0, Math.PI * 2); ctx.clip();
    if (d.avEl) ctx.drawImage(d.avEl, P, y, av, av);
    else { ctx.fillStyle = acc; ctx.fillRect(P, y, av, av); ctx.fillStyle = lum(acc) > 0.62 ? '#111' : '#fff'; ctx.font = FONT(800, av * 0.5); ctx.textAlign = 'center'; ctx.fillText((d.user[0] || '?').toUpperCase(), P + av / 2, y + av * 0.68); }
    ctx.restore(); ctx.textAlign = 'left';
  }
  ctx.fillStyle = T.ink; ctx.font = FONT(700, av * 0.5);
  ctx.fillText('@' + d.user, P + (s.avatar ? av + 20 : 0), y + av * 0.66);
  y += av + (story ? 44 : 30);

  // rodapé
  const footY = H - (story ? 150 : 64);
  ctx.font = FONT(600, 26); ctx.fillStyle = T.dark ? 'rgba(255,255,255,.5)' : 'rgba(20,19,26,.5)';
  ctx.fillText('last.fm', P, footY);
  ctx.textAlign = 'right'; ctx.fillText('Match Musical', W - P, footY); ctx.textAlign = 'left';

  const top = y, availH = footY - 50 - top, fullW = W - 2 * P, n = items.length;
  if (!n) return;

  if (s.layout === 'lista') {
    const gap = 14, rowH = Math.min(170, (availH - gap * (n - 1)) / n);
    items.forEach((a, i) => {
      const rx = P, ry = top + i * (rowH + gap), first = i === 0, pad = 14;
      rr(ctx, rx, ry, fullW, rowH, Math.min(28, rowH / 2.4));
      if (first) {
        const g = ctx.createLinearGradient(rx, ry, rx + fullW, ry);
        g.addColorStop(0, acc); g.addColorStop(1, hsl(h + 45, 85, 55)); ctx.fillStyle = g;
      } else ctx.fillStyle = T.dark ? 'rgba(255,255,255,.07)' : 'rgba(20,19,26,.06)';
      ctx.fill();
      const fg = first ? (lum(acc) > 0.62 ? '#111' : '#fff') : T.ink;
      const rs = Math.min(rowH * 0.36, 52); ctx.font = FONT(900, rs);
      ctx.fillStyle = first ? fg : (T.dark ? acc : hsl(h, 70, 40));
      const rw = ctx.measureText('00').width;
      ctx.fillText(String(i + 1).padStart(2, '0'), rx + 26, ry + rowH / 2 + rs * 0.35);
      const th = rowH - pad * 2, cx = rx + 26 + rw + 20;
      drawCover(ctx, a, cx, ry + pad, th, Math.min(16, th / 6), h);
      const tx = cx + th + 22;
      let pw = 0, ptxt = '', ps = Math.max(20, Math.min(28, rowH * 0.2));
      if (s.plays) { ptxt = `${a.plays.toLocaleString('pt-BR')} plays`; ctx.font = FONT(600, ps); pw = ctx.measureText(ptxt).width + 24; }
      const maxW = rx + fullW - 28 - tx - pw;
      const ns = fitSize(ctx, a.name, maxW, Math.min(first ? 52 : 42, rowH * 0.3), 20, 800), as = Math.max(18, ns * 0.64);
      const total = ns + as * 1.3, base = ry + (rowH - total) / 2 + ns * 0.85;
      ctx.fillStyle = fg; ctx.font = FONT(800, ns); ctx.fillText(clip(ctx, a.name, maxW), tx, base);
      ctx.globalAlpha = 0.72; ctx.font = FONT(600, as); ctx.fillText(clip(ctx, a.artist, maxW), tx, base + as * 1.3); ctx.globalAlpha = 1;
      if (s.plays) {
        ctx.font = FONT(600, ps); ctx.textAlign = 'right'; ctx.globalAlpha = 0.75; ctx.fillStyle = fg;
        ctx.fillText(ptxt, rx + fullW - 28, ry + rowH / 2 + ps * 0.35); ctx.globalAlpha = 1; ctx.textAlign = 'left';
      }
    });
    return;
  }

  // grade de capas
  const cols = n <= 4 ? 2 : 3, rows = Math.ceil(n / cols), gap = 22, cap = s.names ? 84 : 0;
  const sz = Math.floor(Math.min((fullW - gap * (cols - 1)) / cols, (availH - rows * cap - gap * (rows - 1)) / rows));
  const gw = cols * sz + gap * (cols - 1), gh = rows * (sz + cap) + gap * (rows - 1);
  const ox = P + (fullW - gw) / 2, oy = top + Math.max(0, (availH - gh) / 2), rad = Math.min(30, sz * 0.08);
  items.forEach((a, i) => {
    const x = ox + (i % cols) * (sz + gap), cy = oy + Math.floor(i / cols) * (sz + cap + gap);
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 34; ctx.shadowOffsetY = 14;
    rr(ctx, x, cy, sz, sz, rad); ctx.fillStyle = '#000'; ctx.fill(); ctx.restore();
    drawCover(ctx, a, x, cy, sz, rad, h);
    const bs = Math.max(36, sz * 0.15), bx = x + 14 + bs / 2, by = cy + 14 + bs / 2;
    ctx.beginPath(); ctx.arc(bx, by, bs / 2, 0, Math.PI * 2);
    ctx.fillStyle = i === 0 ? acc : 'rgba(0,0,0,.65)'; ctx.fill();
    ctx.fillStyle = i === 0 && lum(acc) > 0.62 ? '#111' : '#fff'; ctx.font = FONT(900, bs * 0.55); ctx.textAlign = 'center';
    ctx.fillText(String(i + 1), bx, by + bs * 0.2); ctx.textAlign = 'left';
    if (s.names) {
      const fs = Math.max(18, Math.min(26, sz * 0.085));
      ctx.font = FONT(800, fs); ctx.fillStyle = T.ink; ctx.fillText(clip(ctx, a.name, sz), x, cy + sz + fs + 10);
      ctx.font = FONT(600, fs * 0.86); ctx.globalAlpha = 0.65;
      ctx.fillText(clip(ctx, s.plays ? `${a.artist} · ${a.plays.toLocaleString('pt-BR')} plays` : a.artist, sz), x, cy + sz + fs + 10 + fs * 1.2);
      ctx.globalAlpha = 1;
    }
  });
}

async function renderPoster(a, p) {
  render(`<div class="spinner"></div><p class="center">Buscando seus álbuns…</p>`);
  let d;
  try { d = await loadAlbums(a, p); } catch (e) { return renderForm({ a, p }, errorMessage(e, a)); }
  if (!d.albums.length) return renderForm({ a, p }, `${d.user} não tem álbuns ouvidos em "${periodLabel(p)}". Tenta um período maior.`);
  const setUrl = per => history.replaceState(null, '', `${BASE_URL}?${new URLSearchParams({ v: 'img', a: d.user, p: per })}`);
  setUrl(p);
  let s;
  try { s = { ...POSTER_DEFAULTS, ...JSON.parse(local.get('poster2') || '{}') }; } catch { s = { ...POSTER_DEFAULTS }; }
  s.p = p;

  const seg = (k, label, opts) => `<label>${label}</label><div class="chips" data-k="${k}">${opts.map(([v, l]) =>
    `<button type="button" class="chip" data-v="${v}" aria-pressed="${String(v) === String(s[k])}">${l}</button>`).join('')}</div>`;
  const chk = (id, on, label) => `<label class="check"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}> ${label}</label>`;
  render(`
    <h1 class="center">Seus álbuns mais ouvidos</h1>
    <p class="center">Monte a imagem do jeito que quiser e exporte pra postar.</p>
    <div class="poster-wrap"><canvas id="cv" aria-label="Prévia da imagem"></canvas></div>
    <div class="row">
      <button class="btn" id="dl">Baixar PNG</button>
      ${navigator.share ? '<button class="btn ghost" id="sh">Compartilhar</button>' : ''}
    </div>
    <p class="error" id="msg"></p>
    <div class="card" id="ctl">
      <label for="t">Título</label>
      <input type="text" id="t" maxlength="40" value="${esc(s.title)}" spellcheck="false">
      ${seg('p', 'Período', PERIODS.map(x => [x.id, x.label]))}
      ${seg('fmt', 'Formato', Object.entries(FORMATS).map(([k, v]) => [k, v[0]]))}
      ${seg('layout', 'Layout', [['grade', 'Grade de capas'], ['lista', 'Lista']])}
      ${seg('n', 'Quantidade de álbuns', [[4, '4'], [6, '6'], [9, '9']])}
      ${seg('theme', 'Tema', Object.entries(THEMES).map(([k, v]) => [k, v.label]))}
      <label>Cor de destaque</label>
      <div class="swatches">
        ${SWATCHES.map(c => `<button type="button" class="sw" data-c="${c}" style="background:${c}" aria-label="${c}" aria-pressed="${c === s.accent}"></button>`).join('')}
        <input type="color" id="col" value="${s.accent}" aria-label="Cor personalizada">
      </div>
      ${chk('st', s.showTitle, 'Mostrar título')}
      ${chk('nm', s.names, 'Mostrar nome do álbum e do artista (na grade)')}
      ${chk('pl', s.plays, 'Mostrar quantidade de plays')}
      ${chk('av', s.avatar, 'Mostrar minha foto')}
    </div>
    <button class="btn ghost" id="back" style="margin-top:20px">Voltar</button>`);

  const cv = document.getElementById('cv'), msg = document.getElementById('msg'), ctl = document.getElementById('ctl');
  const draw = () => drawPoster(cv, d, s);
  const save = () => local.set('poster2', JSON.stringify({ ...s, p: undefined }));
  const press = (sel, test) => ctl.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', test(b)));
  draw();

  ctl.addEventListener('click', async ev => {
    const sw = ev.target.closest('.sw'), chip = ev.target.closest('.chip');
    if (sw) { s.accent = sw.dataset.c; document.getElementById('col').value = s.accent; press('.sw', b => b === sw); save(); return draw(); }
    if (!chip) return;
    const k = chip.parentElement.dataset.k, v = chip.dataset.v;
    if (k === 'p') {
      msg.textContent = ''; cv.style.opacity = 0.4;
      try {
        const nd = await loadAlbums(d.user, v);
        if (!nd.albums.length) throw Object.assign(new Error('vazio'), { code: 'empty' });
        d = nd; s.p = v; setUrl(v); press('[data-k=p] .chip', b => b === chip); draw();
      } catch (e) { msg.textContent = e.code === 'empty' ? `Sem álbuns em "${periodLabel(v)}". Tenta outro período.` : errorMessage(e, d.user); }
      cv.style.opacity = 1; return;
    }
    s[k] = k === 'n' ? +v : v; save();
    press(`[data-k=${k}] .chip`, b => b === chip); draw();
  });
  document.getElementById('t').oninput = e => { s.title = e.target.value; save(); draw(); };
  document.getElementById('col').oninput = e => { s.accent = e.target.value; press('.sw', () => false); save(); draw(); };
  [['st', 'showTitle'], ['nm', 'names'], ['pl', 'plays'], ['av', 'avatar']].forEach(([id, k]) => document.getElementById(id).onchange = e => { s[k] = e.target.checked; save(); draw(); });

  const toBlob = () => new Promise(r => cv.toBlob(r, 'image/png'));
  const fname = () => `top-albuns-${d.user}.png`;
  async function download() {
    const b = await toBlob(); if (!b) return msg.textContent = 'Não consegui gerar a imagem.';
    const u = URL.createObjectURL(b), l = document.createElement('a');
    l.href = u; l.download = fname(); l.click(); setTimeout(() => URL.revokeObjectURL(u), 2000);
  }
  document.getElementById('dl').onclick = download;
  const sh = document.getElementById('sh');
  if (sh) sh.onclick = async () => {
    const b = await toBlob(); if (!b) return;
    const f = new File([b], fname(), { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) navigator.share({ files: [f], title: s.title }).catch(() => {});
    else download();
  };
  document.getElementById('back').onclick = () => { history.replaceState(null, '', BASE_URL); renderForm({ a: d.user, p: s.p }); };
}

// ---------- Início ----------
(function main() {
  if (API_KEY.startsWith('COLE_')) return renderSetup();
  const q = new URLSearchParams(location.search);
  const a = q.get('a'), b = q.get('b');
  const p = PERIODS.some(x => x.id === q.get('p')) ? q.get('p') : '1month';
  if (a && q.get('v') === 'img') renderPoster(a, q.get('p') ? p : '7day');
  else if (a && b) run(a, b, p);
  else if (a) renderInvite(a, p);
  else renderForm();
})();
</script>
