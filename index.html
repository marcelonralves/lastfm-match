<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Musical</title>
<meta name="description" content="Descubra a porcentagem de match musical entre duas pessoas pelo Last.fm.">
<style>
  :root {
    --bg: #0f1012;
    --card: #181a1d;
    --line: #2a2d32;
    --text: #f2f3f5;
    --muted: #9aa0a8;
    --accent: #ff4d6d;
    --accent-ink: #2b0710;
    --track: #2a2d32;
    --danger: #ff8a8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; min-height: 100vh; }
  main { max-width: 520px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.9rem; line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.02em; }
  h2 { font-size: 1.1rem; margin: 28px 0 12px; }
  p { margin: 0 0 12px; color: var(--muted); }
  .brand { font-weight: 700; color: var(--accent); font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 20px; cursor: pointer; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-top: 16px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 14px 0 6px; }
  input[type=text] {
    width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 1rem;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--text); font-size: .9rem; cursor: pointer;
  }
  .chip[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px 18px; border: 0; border-radius: 999px;
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1rem; cursor: pointer;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .6; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 600; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row .btn { flex: 1; }
  .list { list-style: none; padding: 0; margin: 0; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .pos { width: 24px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; flex-shrink: 0; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 1.1rem;
  }
  .name { font-weight: 600; color: var(--text); text-decoration: none; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { font-size: .82rem; color: var(--muted); }
  .grow { min-width: 0; flex: 1; }
  .duo { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 8px; }
  .duo .avatar { width: 52px; height: 52px; border: 2px solid var(--bg); }
  .duo .amp { color: var(--muted); font-weight: 700; }
  .ring-wrap { display: grid; place-items: center; margin: 20px 0 8px; }
  .ring {
    --p: 0; width: 200px; height: 200px; border-radius: 50%;
    background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--track) 0);
    display: grid; place-items: center; position: relative;
  }
  .ring::before { content: ""; position: absolute; inset: 14px; border-radius: 50%; background: var(--bg); }
  .ring span { position: relative; font-size: 3rem; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .verdict { text-align: center; font-size: 1.15rem; font-weight: 700; color: var(--text); margin: 8px 0 4px; }
  .center { text-align: center; }
  .error { color: var(--danger); margin-top: 12px; }
  .spinner {
    width: 40px; height: 40px; border-radius: 50%; margin: 60px auto 16px;
    border: 4px solid var(--track); border-top-color: var(--accent); animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .foot { font-size: .78rem; color: var(--muted); margin-top: 28px; text-align: center; }
  code { background: var(--card); padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
// ====== CONFIGURAÇÃO ======
// Cole aqui a sua API key do Last.fm (last.fm/api/account/create)
const API_KEY = '0b7a6904d2efddf9d8620f85e611178a';
const LIMIT = 50;
// ==========================

const PERIODS = [
  { id: '7day', label: '7 dias' },
  { id: '1month', label: '1 mês' },
  { id: '3month', label: '3 meses' },
  { id: '12month', label: '1 ano' },
  { id: 'overall', label: 'Sempre' }
];
const BASE_URL = location.origin + location.pathname;
const app = document.getElementById('app');

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const local = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const periodLabel = id => (PERIODS.find(p => p.id === id) || PERIODS[1]).label;

// ---------- Last.fm ----------
async function lfm(params) {
  const url = 'https://ws.audioscrobbler.com/2.0/?' + new URLSearchParams({ ...params, api_key: API_KEY, format: 'json' });
  let r, d;
  try { r = await fetch(url); d = await r.json(); }
  catch { const e = new Error('rede'); e.code = 'net'; throw e; }
  if (d && d.error) { const e = new Error(d.message); e.code = d.error; throw e; }
  return d;
}

async function loadUser(user, period) {
  const [info, top] = await Promise.all([
    lfm({ method: 'user.getinfo', user }),
    lfm({ method: 'user.gettopartists', user, period, limit: LIMIT })
  ]);
  const u = info.user || {};
  const imgs = Array.isArray(u.image) ? u.image : [];
  const img = (imgs.find(i => i.size === 'large') || imgs[imgs.length - 1] || {})['#text'] || '';
  const list = (top.topartists && top.topartists.artist) || [];
  return {
    user: u.name || user,
    name: u.realname || u.name || user,
    img,
    artists: (Array.isArray(list) ? list : [list]).map(a => ({ name: a.name, plays: +a.playcount || 0, url: a.url }))
  };
}

function errorMessage(e, who) {
  if (e.code === 6) return `Não encontrei o usuário "${who}" no Last.fm. Confere o nome?`;
  if (e.code === 10 || e.code === 26) return 'A API key do Last.fm está inválida. Confira a constante API_KEY no arquivo.';
  if (e.code === 29) return 'Muitas consultas seguidas. Espera um minutinho e tenta de novo.';
  if (e.code === 17) return `O perfil de "${who}" está privado no Last.fm.`;
  if (e.code === 'net') return 'Não consegui falar com o Last.fm. Confere a internet e tenta de novo.';
  return 'Algo deu errado ao buscar os dados. Tenta de novo.';
}

// ---------- Match ----------
function weights(artists) {
  const m = new Map(), N = artists.length;
  artists.forEach((a, i) => m.set(a.name.toLowerCase(), { w: (N - i) / N, rank: i + 1, plays: a.plays }));
  return m;
}

function computeMatch(A, B) {
  const a = weights(A.artists), b = weights(B.artists);
  let shared = 0, total = 0;
  a.forEach(v => total += v.w);
  b.forEach(v => total += v.w);
  const common = [];
  A.artists.forEach(art => {
    const k = art.name.toLowerCase();
    if (b.has(k)) {
      const wa = a.get(k), wb = b.get(k);
      shared += Math.min(wa.w, wb.w);
      common.push({ ...art, a: wa, b: wb, score: wa.w * wb.w });
    }
  });
  common.sort((x, y) => y.score - x.score);
  const raw = total ? (2 * shared) / total : 0;
  // curva de raiz: a sobreposição bruta costuma ser baixa, isso deixa o número mais intuitivo
  return { pct: Math.round(100 * Math.sqrt(raw)), common };
}

function verdict(p) {
  if (p >= 80) return 'Almas gêmeas musicais';
  if (p >= 60) return 'Dá pra dividir o fone';
  if (p >= 40) return 'Bastante coisa em comum';
  if (p >= 20) return 'Alguns pontos de encontro';
  if (p > 0) return 'Gostos bem diferentes';
  return 'Mundos opostos';
}

// ---------- Visual ----------
function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function avatar(name, img) {
  if (img) return `<img class="avatar" src="${esc(img)}" alt="">`;
  return `<div class="avatar" style="background:hsl(${hue(name)} 55% 38%)">${esc((name || '?')[0].toUpperCase())}</div>`;
}
function render(html) {
  app.innerHTML = `<div class="brand" id="home">Match Musical</div>` + html;
  document.getElementById('home').onclick = () => { history.replaceState(null, '', BASE_URL); renderForm(); };
}

// ---------- Telas ----------
function renderSetup() {
  render(`<h1>Falta configurar</h1><p>Abra este arquivo e cole sua API key do Last.fm na constante <code>API_KEY</code>.</p>`);
}

function renderForm(prefill = {}, error = '') {
  let period = prefill.p || local.get('period') || '1month';
  render(`
    <h1>Qual é o match musical de vocês?</h1>
    <p>Compara os artistas mais ouvidos de duas pessoas no Last.fm e calcula a afinidade.</p>
    <form class="card" id="f" autocomplete="off">
      <label for="a">Seu usuário do Last.fm</label>
      <input type="text" id="a" value="${esc(prefill.a ?? local.get('me'))}" autocapitalize="none" spellcheck="false" required>
      <label for="b">Usuário da outra pessoa</label>
      <input type="text" id="b" value="${esc(prefill.b || '')}" autocapitalize="none" spellcheck="false" required>
      <label>Período</label>
      <div class="chips">${PERIODS.map(p => `<button type="button" class="chip" data-p="${p.id}" aria-pressed="${p.id === period}">${p.label}</button>`).join('')}</div>
      <button class="btn" style="margin-top:20px">Calcular match</button>
      ${error ? `<p class="error">${esc(error)}</p>` : ''}
    </form>
    <p class="foot">Não tem Last.fm? Crie em last.fm e conecte ao seu Spotify em Configurações → Aplicativos.</p>`);
  app.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    period = c.dataset.p;
    app.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c));
  });
  document.getElementById('f').onsubmit = ev => {
    ev.preventDefault();
    const a = document.getElementById('a').value.trim();
    const b = document.getElementById('b').value.trim();
    if (!a || !b) return;
    local.set('me', a); local.set('period', period);
    run(a, b, period);
  };
}

async function run(a, b, p) {
  history.replaceState(null, '', `${BASE_URL}?${new URLSearchParams({ a, b, p })}`);
  render(`<div class="spinner"></div><p class="center">Comparando os ouvidos…</p>`);
  let A, B;
  try { A = await loadUser(a, p); } catch (e) { return renderForm({ a, b, p }, errorMessage(e, a)); }
  try { B = await loadUser(b, p); } catch (e) { return renderForm({ a, b, p }, errorMessage(e, b)); }
  if (A.user.toLowerCase() === B.user.toLowerCase()) return renderForm({ a, b: '', p }, 'Coloca o usuário de outra pessoa no segundo campo 😄');
  if (!A.artists.length || !B.artists.length) {
    const empty = !A.artists.length ? A.user : B.user;
    return renderForm({ a, b, p }, `${empty} não tem scrobbles em "${periodLabel(p)}". Tenta um período maior.`);
  }
  renderResult(A, B, p);
}

function renderResult(A, B, p) {
  const { pct, common } = computeMatch(A, B);
  const link = location.href;
  render(`
    <div class="duo">${avatar(A.name, A.img)}<span class="amp">&</span>${avatar(B.name, B.img)}</div>
    <h1 class="center" style="margin-top:12px">${esc(A.user)} e ${esc(B.user)}</h1>
    <p class="center">${periodLabel(p)}</p>
    <div class="ring-wrap"><div class="ring" id="ring"><span id="pct">0%</span></div></div>
    <div class="verdict">${verdict(pct)}</div>
    <p class="center">${common.length} ${common.length === 1 ? 'artista em comum' : 'artistas em comum'} no top ${LIMIT} de cada um</p>
    ${common.length
      ? `<h2>Artistas em comum</h2>
         <div class="card"><ul class="list">${common.map((c, i) => `
           <li class="item"><span class="pos">${i + 1}</span>${avatar(c.name)}
             <div class="grow">
               <a class="name" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.name)}</a>
               <div class="meta">${esc(A.user)}: #${c.a.rank} · ${c.a.plays} plays &nbsp;|&nbsp; ${esc(B.user)}: #${c.b.rank} · ${c.b.plays} plays</div>
             </div></li>`).join('')}
         </ul></div>`
      : `<div class="card"><p style="margin:0">Nenhum artista em comum nesse período.</p></div>`}
    <div class="row" style="margin-top:20px">
      <button class="btn" id="copy">Copiar link</button>
      ${navigator.share ? '<button class="btn ghost" id="share">Compartilhar</button>' : ''}
    </div>
    <div class="row">
      <button class="btn ghost" id="other">Trocar período</button>
      <button class="btn ghost" id="new">Novo match</button>
    </div>
    <p class="foot">Baseado nos ${LIMIT} artistas mais ouvidos de cada um no Last.fm.</p>`);

  const copy = document.getElementById('copy');
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(link); copy.textContent = 'Copiado!'; }
    catch { prompt('Copie o link:', link); }
    setTimeout(() => copy.textContent = 'Copiar link', 2000);
  };
  const share = document.getElementById('share');
  if (share) share.onclick = () => navigator.share({ title: 'Match Musical', text: `Nosso match musical deu ${pct}%`, url: link }).catch(() => {});
  document.getElementById('other').onclick = () => renderForm({ a: A.user, b: B.user, p });
  document.getElementById('new').onclick = () => { history.replaceState(null, '', BASE_URL); renderForm({ a: A.user }); };

  const ring = document.getElementById('ring'), label = document.getElementById('pct');
  const start = performance.now(), dur = 1200;
  (function tick(now) {
    const t = Math.min(1, (now - start) / dur), v = Math.round(pct * (1 - Math.pow(1 - t, 3)));
    ring.style.setProperty('--p', v); label.textContent = v + '%';
    if (t < 1) requestAnimationFrame(tick);
  })(start);
}

// ---------- Início ----------
(function main() {
  if (API_KEY.startsWith('COLE_')) return renderSetup();
  const q = new URLSearchParams(location.search);
  const a = q.get('a'), b = q.get('b');
  const p = PERIODS.some(x => x.id === q.get('p')) ? q.get('p') : '1month';
  if (a && b) run(a, b, p); else renderForm();
})();
</script>
</body>
</html>
